<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch API Lab</title>
</head>
<body>

    <h2>Fetch API Demo</h2>

    <button onclick="getPost()">Load Post</button>
    <button onclick="createPost()">Create Post</button>

    <div id="output" style="margin-top:20px;"></div>

    <script>

        function getPost() {

            let output = document.getElementById("output");

            output.innerHTML = "Getting post...";

            fetch("https://jsonplaceholder.typicode.com/posts/1")
                .then(function(response) {

                    if (!response.ok) {
                        throw new Error("Request failed: " + response.status);
                    }

                    return response.json();
                })
                .then(function(data) {

                    output.innerHTML =
                        "<h3>Post Loaded!</h3>" +
                        "<b>Title:</b> " + data.title +
                        "<br><br>" +
                        "<b>Content:</b> " + data.body;
                })
                .catch(function(error) {

                    output.innerHTML =
                        "<p style='color:red;'>Error: " +
                        error.message + "</p>";
                });
        }


        function createPost() {

            let output = document.getElementById("output");

            output.innerHTML = "Creating post...";

            fetch("https://jsonplaceholder.typicode.com/posts", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    title: "My New Post",
                    body: "Learning Fetch API is fun!",
                    userId: 1
                })

            })
            .then(function(response) {

                if (!response.ok) {
                    throw new Error("Could not create post");
                }

                return response.json();
            })
            .then(function(data) {

                output.innerHTML =
                    "<h3>New Post Created!</h3>" +
                    "<b>Post ID:</b> " + data.id +
                    "<br>" +
                    "<b>Message:</b> Post was successfully sent!";
            })
            .catch(function(error) {

                output.innerHTML =
                    "<p style='color:red;'>Error: " +
                    error.message + "</p>";
            });
        }

    </script>

</body>
</html>
